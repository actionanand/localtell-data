name: LocalTell Web

on:
  push:
    branches:
      - main-github
  pull_request:
    branches:
      - main-github
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish to gh-pages (only on main-github)'
        type: boolean
        default: false

# The publishing step authenticates using a repository SSH deploy key.
permissions:
  contents: read

concurrency:
  group: localtell-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: frontend/local-tell

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/local-tell/.nvmrc
          cache: npm
          cache-dependency-path: frontend/local-tell/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit and script tests
        run: npm run test:ci

      - name: Inject public Dropbox App key
        run: node scripts/inject-dropbox-key.mjs
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_KEY_REQUIRED: ${{ github.ref == 'refs/heads/main-github' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}

      - name: Build Angular application for GitHub Pages
        run: npm run build:gh
        env:
          BASE_HREF: /localtell-data/

      - name: Verify Dropbox production configuration
        run: node scripts/inject-dropbox-key.mjs --verify
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_KEY_REQUIRED: ${{ github.ref == 'refs/heads/main-github' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy)) }}

      - name: Mirror verified geographic packs
        run: npm run mirror:data

      - name: Browser integration tests
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
        env:
          E2E_PACKS: '1'

      - name: Verify complete publish directory
        run: |
          set -eu
          out=dist/local-tell/browser
          test -s "$out/index.html"
          test -s "$out/404.html"
          test -s "$out/ngsw.json"
          test -s "$out/ngsw-worker.js"
          test -s "$out/assets/sqljs/sql-wasm-browser.wasm"
          test -s "$out/data-mirror/cell-data-v3/manifest.json"
          test -s "$out/data-mirror/country-lk-v1/manifest-LK.json"
          test -s "$out/icons/icon-192.png"

      - name: Publish Angular build to gh-pages
        if: >-
          github.ref == 'refs/heads/main-github' &&
          (github.event_name == 'push' ||
           (github.event_name == 'workflow_dispatch' && inputs.deploy))
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
          publish_branch: gh-pages
          # 'uses' actions resolve this path from repository root, not defaults.run.working-directory.
          publish_dir: ./frontend/local-tell/dist/local-tell/browser
          enable_jekyll: false
          keep_files: false
